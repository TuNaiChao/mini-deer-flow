# ============================================================
# Deer-Flow 配置示例
# ============================================================
# 将此文件复制为 config.yaml 并修改配置

# --- 日志级别 ---
log_level: info

# ============================================================
# 模型配置
# ============================================================
# 每个模型配置的关键字段：
#   name:  模型的唯一名称（在 Agent 代码中引用）
#   use:   模型类的导入路径 "module.path:ClassName"
#   model: 传递给提供者的模型标识符
#
# 其他字段（如 api_key, temperature 等）通过 extra="allow" 自动透传
# ============================================================
models:

  # --- DeepSeek V3（默认模型，支持推理思考）---
  # 注意：DeepSeek-V3 / V3.1 的 API 端点目前对外暴露的是纯文本对话能力。
  # 虽然官方在 2025 年发布的 V3.1 模型已支持视觉输入，但 deepseek-chat
  # 在多数账号下仍以文本为主。如确认你的账号已开通视觉权限，可把下方
  # supports_vision 改为 true（届时阶段5 的 ViewImageMiddleware 会自动挂载）。
  - name: deepseek
    display_name: DeepSeek V3
    use: langchain_deepseek:ChatDeepSeek
    model: deepseek-chat
    api_key: $DEEPSEEK_API_KEY
    temperature: 0.7
    max_tokens: 8192
    timeout: 600.0
    max_retries: 2
    supports_thinking: false
    supports_vision: false

  # --- DeepSeek-R1（深度推理模型）---
  - name: deepseek-r1
    display_name: DeepSeek R1 (Reasoning)
    use: langchain_deepseek:ChatDeepSeek
    model: deepseek-reasoner
    api_key: $DEEPSEEK_API_KEY
    temperature: 0.7
    max_tokens: 8192
    timeout: 600.0
    max_retries: 2
    supports_thinking: true
    supports_vision: false

  # ============================================================
  # Qwen-VL 多模态模型 —— 三条接入路径，按需选择其一
  # ============================================================
  # 推荐：小白无 GPU 时使用路径 A（阿里云 DashScope 官方云 API）。
  # 路径 B（Ollama 本地）和路径 C（vLLM 自托管）需要 GPU。

  # --- 路径 A：Qwen-VL 阿里云 DashScope 官方云 API（推荐，无需 GPU）---
  # 阿里云 DashScope 提供 OpenAI 兼容端点，可直接用 langchain_openai.ChatOpenAI 接入。
  # 申请 Key：https://bailian.console.aliyun.com/ → 模型广场 → qwen-vl-max
  - name: qwen-vl
    display_name: Qwen-VL (DashScope Cloud)
    use: langchain_openai:ChatOpenAI
    model: qwen-vl-max            # 或 qwen2.5-vl-72b-instruct / qwen-vl-plus
    api_key: $DASHSCOPE_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    temperature: 0.7
    max_tokens: 4096
    supports_thinking: false
    supports_vision: true

  # --- 路径 B：Qwen-VL 通过 Ollama 本地部署（需要 GPU，8GB+ 显存）---
  # 安装 Ollama → `ollama pull qwen2.5-vl:7b` → 取消下方注释、注释掉路径 A
  # - name: qwen-vl
  #   display_name: Qwen-VL (Ollama)
  #   use: langchain_ollama:ChatOllama
  #   model: qwen2.5-vl:7b
  #   base_url: http://localhost:11434
  #   temperature: 0.7
  #   num_predict: 4096
  #   supports_thinking: false
  #   supports_vision: true

  # --- 路径 C：Qwen-VL 通过 vLLM 自托管（需要 GPU 集群）---
  # - name: qwen-vl-vllm
  #   display_name: Qwen-VL (vLLM)
  #   use: langchain_openai:ChatOpenAI
  #   model: Qwen/Qwen2.5-VL-72B-Instruct
  #   api_key: $VLLM_API_KEY
  #   base_url: http://localhost:8000/v1
  #   max_tokens: 4096
  #   supports_thinking: false
  #   supports_vision: true

  # --- OpenAI 兼容接口（可选）---
  # - name: gpt-4o
  #   display_name: GPT-4o
  #   use: langchain_openai:ChatOpenAI
  #   model: gpt-4o
  #   api_key: $OPENAI_API_KEY
  #   temperature: 0.7
  #   max_tokens: 4096
  #   supports_vision: true

# ============================================================
# 沙箱配置
# ============================================================
sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider

# ============================================================
# 记忆系统
# ============================================================
memory:
  enabled: true
  max_facts: 100
  debounce_seconds: 30
  injection_enabled: true
  max_injection_tokens: 2000

# ============================================================
# 子代理配置
# ============================================================
subagents:
  enabled: true
  max_concurrent: 3

# ============================================================
# 标题自动生成
# ============================================================
title:
  enabled: true
  max_words: 10

# ============================================================
# 循环检测
# ============================================================
loop_detection:
  enabled: true
  warn_threshold: 3
  hard_limit: 5

# ============================================================
# 数据库配置
# ============================================================
database:
  backend: sqlite

# ============================================================
# 追踪配置（可选）
# ============================================================
# tracing:
#   langsmith:
#     enabled: false
#   langfuse:
#     enabled: false