# ============================================================
# Deer-Flow 配置示例
# ============================================================
# 将此文件复制为 config.yaml 并修改配置

# 配置 schema 版本（低于 config.example.yaml 时启动告警；缺失视为 0）。
# 改 schema 时同步 bump 此值。
config_version: 1

# --- 日志级别 ---
log_level: info

# ============================================================
# 模型配置
# ============================================================
# 每个模型配置的关键字段：
#   name:  模型的唯一名称（在 Agent 代码中引用）
#   use:   模型类的导入路径 "module.path:ClassName"
#   model: 传递给提供者的模型标识符
#
# 其他字段（如 api_key, temperature 等）通过 extra="allow" 自动透传
# ============================================================
models:

  # --- DeepSeek V4 Pro（默认模型，支持推理思考）---
  # 注意：DeepSeek-V4 Pro 的 API 端点目前对外暴露的是纯文本对话能力。
  # 虽然官方在 2025 年发布的 V4 Pro 模型已支持视觉输入，但 deepseek-chat
  # 在多数账号下仍以文本为主。如确认你的账号已开通视觉权限，可把下方
  # supports_vision 改为 true（届时阶段5 的 ViewImageMiddleware 会自动挂载）。
  - name: deepseek
    display_name: DeepSeek V4 Pro
    use: langchain_deepseek:ChatDeepSeek
    model: deepseek-v4-pro
    api_key: $DEEPSEEK_API_KEY
    temperature: 0.7
    max_tokens: 8192
    timeout: 600.0
    max_retries: 2
    supports_thinking: false
    supports_vision: false

  # --- DeepSeek-R1（深度推理模型）---
  # - name: deepseek-r1
  #   display_name: DeepSeek R1 (Reasoning)
  #   use: langchain_deepseek:ChatDeepSeek
  #   model: deepseek-reasoner
  #   api_key: $DEEPSEEK_API_KEY
  #   temperature: 0.7
  #   max_tokens: 8192
  #   timeout: 600.0
  #   max_retries: 2
  #   supports_thinking: true
  #   supports_vision: false

  # ============================================================
  # Qwen-VL 多模态模型 —— 三条接入路径，按需选择其一
  # ============================================================
  # 推荐：小白无 GPU 时使用路径 A（阿里云 DashScope 官方云 API）。
  # 路径 B（Ollama 本地）和路径 C（vLLM 自托管）需要 GPU。

  # --- 路径 A：Qwen-VL 阿里云 DashScope 官方云 API（推荐，无需 GPU）---
  # 阿里云 DashScope 提供 OpenAI 兼容端点，可直接用 langchain_openai.ChatOpenAI 接入。
  # 申请 Key：https://bailian.console.aliyun.com/ → 模型广场 → qwen-vl-max
  - name: qwen-vl
    display_name: Qwen-VL (DashScope Cloud)
    use: langchain_openai:ChatOpenAI
    model: qwen-vl-max            # 或 qwen2.5-vl-72b-instruct / qwen-vl-plus
    api_key: $DASHSCOPE_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    temperature: 0.7
    max_tokens: 4096
    supports_thinking: false
    supports_vision: true

  # --- 路径 B：Qwen-VL 通过 Ollama 本地部署（需要 GPU，8GB+ 显存）---
  # 安装 Ollama → `ollama pull qwen2.5-vl:7b` → 取消下方注释、注释掉路径 A
  # - name: qwen-vl
  #   display_name: Qwen-VL (Ollama)
  #   use: langchain_ollama:ChatOllama
  #   model: qwen2.5-vl:7b
  #   base_url: http://localhost:11434
  #   temperature: 0.7
  #   num_predict: 4096
  #   supports_thinking: false
  #   supports_vision: true

  # --- 路径 C：Qwen-VL 通过 vLLM 自托管（需要 GPU 集群）---
  # - name: qwen-vl-vllm
  #   display_name: Qwen-VL (vLLM)
  #   use: langchain_openai:ChatOpenAI
  #   model: Qwen/Qwen2.5-VL-72B-Instruct
  #   api_key: $VLLM_API_KEY
  #   base_url: http://localhost:8000/v1
  #   max_tokens: 4096
  #   supports_thinking: false
  #   supports_vision: true

  # --- 路径 D：vLLM 0.19.0 推理模型（OpenAI 兼容，保留 reasoning 字段）---
  # 当你在 vLLM 上跑「会先想一想的模型」（reasoning model，如 Qwen3 开了思考模式）
  # 时，vLLM 会在返回里多塞一个非标准字段 reasoning。LangChain 默认的 ChatOpenAI
  # 会把它丢掉，导致「想完→调工具→继续想」这种交替流程在多轮里出问题。
  # 用 deerflow 自带的 VllmChatModel（继承 ChatOpenAI，重写三个钩子保住 reasoning）
  # 即可解决。Qwen 系推理模型开关思考用 extra_body.chat_template_kwargs.enable_thinking
  # （deerflow 也会把旧键名 thinking 自动翻译成 enable_thinking）。
  # 注意：部分推理模型还需在服务端用 `vllm serve ... --reasoning-parser <parser>` 启动。
  # - name: qwen3-32b-vllm
  #   display_name: Qwen3 32B (vLLM)
  #   use: deerflow.models.vllm_provider:VllmChatModel
  #   model: Qwen/Qwen3-32B
  #   api_key: $VLLM_API_KEY
  #   base_url: http://localhost:8000/v1
  #   request_timeout: 600.0
  #   max_retries: 2
  #   max_tokens: 8192
  #   supports_thinking: true
  #   supports_vision: false
  #   when_thinking_enabled:
  #     extra_body:
  #       chat_template_kwargs:
  #         enable_thinking: true

  # --- OpenAI 兼容接口（可选）---
  # - name: gpt-4o
  #   display_name: GPT-4o
  #   use: langchain_openai:ChatOpenAI
  #   model: gpt-4o
  #   api_key: $OPENAI_API_KEY
  #   temperature: 0.7
  #   max_tokens: 4096
  #   supports_vision: true

# ============================================================
# 沙箱配置
# ============================================================
sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider

# ============================================================
# 工具配置（沙箱工具）
# ============================================================
# 没有这一段时，agent 只有 present_files + ask_clarification 两个内置工具（纯聊天）。
# 加上下面 7 个沙箱工具（group: sandbox）后，agent 才能执行 bash、读写文件、搜索——
# 真正"能干活"。路径前缀 /mnt/user-data 由 LocalSandbox 翻译到按 (user, thread) 隔离的
# 宿主目录。按需删减；更多工具（web 搜索等）见 docs/community.md。
tools:
  - use: deerflow.sandbox.tools:bash_tool
    group: sandbox
  - use: deerflow.sandbox.tools:ls_tool
    group: sandbox
  - use: deerflow.sandbox.tools:glob_tool
    group: sandbox
  - use: deerflow.sandbox.tools:grep_tool
    group: sandbox
  - use: deerflow.sandbox.tools:read_file_tool
    group: sandbox
  - use: deerflow.sandbox.tools:write_file_tool
    group: sandbox
  - use: deerflow.sandbox.tools:str_replace_tool
    group: sandbox

# ============================================================
# 记忆系统
# ============================================================
memory:
  enabled: true
  max_facts: 100
  debounce_seconds: 30
  injection_enabled: true
  max_injection_tokens: 2000

# ============================================================
# 子代理配置
# ============================================================
subagents:
  enabled: true
  max_concurrent: 3

# ============================================================
# 标题自动生成
# ============================================================
title:
  enabled: true
  max_words: 10

# ============================================================
# 循环检测
# ============================================================
loop_detection:
  enabled: true
  warn_threshold: 3
  hard_limit: 5

# ============================================================
# Token 预算（单 run token 用量上限，默认关）
# ============================================================
# 到 warn_threshold 软提醒模型收尾；到 hard_stop_threshold 剥 tool_calls 强制收尾。
# 三上限取最先突破的：max_tokens（input+output 总和）、max_input_tokens、max_output_tokens（后两个可选）。
# 注：InputSanitizationMiddleware（#1 提示词注入防御）与 SystemMessageCoalescingMiddleware
# （#20 合并 SystemMessage）无开关、始终生效，不在此配置。
token_budget:
  enabled: false
  max_tokens: 200000
  # max_input_tokens: 100000    # 可选：只限 input
  # max_output_tokens: 50000    # 可选：只限 output
  warn_threshold: 0.8           # 用到上限的 80% 时软提醒
  hard_stop_threshold: 1.0      # 用满时硬停（不得低于 warn_threshold）

# ============================================================
# 数据库配置
# ============================================================
# backend:
#   memory —— 进程内（默认，红线 #25：空 config 必须 memory 起步，开箱即用）
#   sqlite —— 持久化到本地文件（需 langgraph-checkpoint-sqlite）
#   postgres —— 持久化到 PostgreSQL（装 deerflow-harness[postgres]）
database:
  backend: memory

# ============================================================
# Checkpointer 配置（LangGraph 状态快照 + Store 共用后端）
# ============================================================
# 省略此段时 checkpointer 用 InMemorySaver、Store 用 InMemoryStore（重启丢失）。
# checkpointer:
#   type: sqlite                       # memory / sqlite / postgres
#   connection_string: .deer-flow/checkpoints.db   # sqlite 文件路径；postgres DSN 必填

# ============================================================
# Run 事件存储（run_journal 写消息 + 轨迹）
# ============================================================
# backend:
#   memory —— 进程内（默认）
#   jsonl —— 每线程一个 .jsonl 文件
#   db —— 需 database.backend=sqlite/postgres
run_events:
  backend: memory
  track_token_usage: true

# ============================================================
# Stream Bridge（SSE 生产者-消费者解耦 + 重连补播）
# ============================================================
# type:
#   memory —— 进程内（默认）；省略此段同 memory
#   redis —— 跨进程（需 redis_url）
stream_bridge:
  type: memory

# ============================================================
# 技能自演化（agent 完成任务后自动创建/更新技能，默认关）
# ============================================================
skill_evolution:
  enabled: false

# ============================================================
# 安全终止拦截（provider content_filter/refusal/SAFETY 时剥 tool_calls）
# ============================================================
safety_finish_reason:
  enabled: true

# ============================================================
# 追踪配置（可选）
# ============================================================
# tracing:
#   langsmith:
#     enabled: false
#   langfuse:
#     enabled: false