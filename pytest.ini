# pytest 配置。test/ 位于本目录（backend 外），故配置须放在项目根，pytest 的
# rootdir 才能覆盖到 test/（若放在 backend/pyproject.toml，rootdir 上移后读不到，
# 导致 asyncio_mode=auto 与 markers 失效）。
[pytest]
testpaths = test
# auto：``async def test_*`` 自动作为 asyncio 测试运行，无需逐个标注
asyncio_mode = auto
markers =
    no_auto_user: 关闭 conftest 的 autouse user-context fixture
    allow_blocking_io: 跳过 test/blocking_io/ 下的严格 blocking-IO gate
