[project]
name = "deerflow-harness"
version = "0.1.0"
description = "Deer-Flow Agent Harness"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0.0",
    "langgraph-cli[inmem]>=0.4.0",
    "langchain>=1.0.0",
    "langchain-openai>=0.3.0",
    "langchain-deepseek>=0.1.0",
    "langchain-ollama>=0.2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deerflow"]