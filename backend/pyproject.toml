[project]
name = "mini-deer-flow"
version = "0.1.0"
description = "mini-deer-flow — a teaching reimplementation of bytedance/deer-flow (MIT). See ../NOTICE."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "deerflow-harness",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]

# 透传 harness 的可选 extras：让 backend 安装时也能一并拉取
# （例如 ``uv sync --extra postgres`` 在 backend 目录下启用 postgres 持久化）
[project.optional-dependencies]
postgres = ["deerflow-harness[postgres]"]
sqlite = ["deerflow-harness[sqlite]"]
aiosqlite = ["deerflow-harness[aiosqlite]"]
mcp = ["deerflow-harness[mcp]"]

# 开发依赖：测试、lint。blocking-IO gate 用 inline 实现（见
# test/support/detectors/blocking_io_runtime.py），无需外部库。
# langgraph-checkpoint-sqlite：sqlite checkpointer 的真实 Saver，测试做 aput/aget_tuple
# 往返时需要它（红线 #24：它是可选 extra，生产 memory 模式不需，故放 dev 而非 core）。
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "langgraph-checkpoint-sqlite>=2.0",
    # pytest 9.1.0 回归：``_pytest/compat.py`` 顶层 ``import py`` 但 METADATA 未声明
    # ``py`` 依赖（Requires-Dist 里没有）。uv 等严格解析器只装声明依赖 → ``py`` 缺失 →
    # ``import pytest`` 抛 ModuleNotFoundError，``make test`` 起不来。显式补 ``py`` 兜住
    # 该回归（§1 冒烟发现）。pytest 修掉这个 undeclared import 后可移除。
    "py>=1.11.0",
]

[tool.uv.workspace]
members = ["packages/harness"]

[tool.uv.sources]
deerflow-harness = { workspace = true }

# pytest 配置已移到项目根的 pytest.ini（test/ 在 backend 外，pytest 的 rootdir
# 上移到项目根，配置须在根才能被读到：asyncio_mode=auto + markers + testpaths）。
# ruff 配置同理移到项目根的 ruff.toml（覆盖 backend/ + test/ 全部代码）。
